services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secret
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - almacen_pgdata:/var/lib/postgresql/data
    networks:
      - inventario_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    networks:
      - inventario_network
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: php_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    networks:
      - inventario_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: secret
      FRONTEND_URL: http://localhost:4200

  frontend:
    container_name: inventario_frontend
    networks:
      - inventario_network
    depends_on:
      - backend

networks:
  inventario_network:
    driver: bridge

volumes:
  almacen_pgdata:
  backend_vendor:
