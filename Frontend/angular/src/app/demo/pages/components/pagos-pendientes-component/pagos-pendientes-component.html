<mat-card class="theme-card">

  <mat-card-header>
    <mat-card-title>Pagos pendientes</mat-card-title>
  </mat-card-header>

  <mat-card-content>

    <!-- BUSCADOR -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Buscar deudor o producto</mat-label>
      <input matInput (keyup)="applyFilter($event)">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <!-- TABLA -->
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1">

      <ng-container matColumnDef="deudor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Deudor</th>
        <td mat-cell *matCellDef="let row">{{ row.deudor }}</td>
      </ng-container>

      <ng-container matColumnDef="productos">
        <th mat-header-cell *matHeaderCellDef>Productos</th>
        <td mat-cell *matCellDef="let row">{{ row.productos }}</td>
      </ng-container>

      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef>Cantidad</th>
        <td mat-cell *matCellDef="let row">{{ row.cantidad }}</td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let row">{{ row.total | currency:'COP' }}</td>
      </ng-container>

      <ng-container matColumnDef="abono">
        <th mat-header-cell *matHeaderCellDef>Abono</th>
        <td mat-cell *matCellDef="let row">{{ row.abono | currency:'COP' }}</td>
      </ng-container>

      <ng-container matColumnDef="saldo">
        <th mat-header-cell *matHeaderCellDef>Saldo</th>
        <td mat-cell *matCellDef="let row">{{ row.saldo | currency:'COP' }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row">
          <span
            [class.pendiente]="row.estado === 'Pendiente'"
            [class.parcial]="row.estado === 'Parcial'"
            [class.pagado]="row.estado === 'Pagado'">
            {{ row.estado }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="editar(row)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    <mat-paginator [pageSize]="5"></mat-paginator>

  </mat-card-content>

</mat-card>
